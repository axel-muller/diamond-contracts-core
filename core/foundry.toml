[profile.default]
extends = "../foundry.base.toml"
src = "contracts"
out = "out"
libs = ["node_modules", "../lib"]
no_match_coverage = "contracts/mocks/.*|scripts/*"

remappings = [
    "@openzeppelin/=node_modules/@openzeppelin/",
    "hardhat/=node_modules/hardhat/",
    "forge-std/=../lib/forge-std/src/",
]

[doc]
ignore = ["**/*.t.sol"]
out = "docs"
repository = "https://github.com/DMDcoin/contracts-monorepo/core"
